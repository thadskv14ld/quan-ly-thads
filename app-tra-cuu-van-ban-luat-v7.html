<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Văn bản luật THADS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: thanh bên hẹp chỉ có một mục "Văn bản luật THADS" ở góc trên trái;
   cột phải gồm thẻ tiêu đề, thẻ tìm kiếm với chip văn bản, rồi hai thẻ Mục lục | Nội dung. */
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#1a2233; --muted:#667189; --line:#e0e5ef;
  --soft:#f4f6fb; --sel:#e8edf6; --accent:#c0392b; --accent-ink:#ffffff; --accent-soft:#fbeceb;
  --mark:#ffe49a; --shadow:0 1px 2px rgba(26,34,51,.06),0 8px 24px rgba(26,34,51,.05);
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-doc:"Times New Roman",Tinos,"Liberation Serif",Georgia,serif;
  --fs:17px;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--warn:#8a5a00;--warn-soft:#fff2d1;--bad:#b42318;--bad-soft:#fdeceb;
  --c-luat:#c0392b;--c-nd:#1565c0;--c-tt:#c25a00;--c-ot:#6d4aa8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:#ffffff;color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-font-smoothing:antialiased;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-block:12px}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.topbar{display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px}
.card.topbar{background:#dde5f1;border-color:#c5d1e4;box-shadow:0 1px 2px rgba(26,34,51,.06),0 6px 18px rgba(60,80,120,.10)}
.toprow{display:flex;align-items:flex-start;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.searchbox{flex:none;width:100%;min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card)}
.searchbox svg{color:var(--accent);flex:none}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;font-size:15px;outline:none}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .clr{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px}
.chips{flex:1 1 auto;display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;gap:6px;justify-content:flex-start;min-width:0}
.chip{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;font-weight:600;font-size:13.5px;box-shadow:0 1px 2px rgba(26,34,51,.05)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--accent);background:transparent;box-shadow:none}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:14px}
.cols.collapsed{grid-template-columns:64px minmax(0,1fr)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pane-h h2{margin:0;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;text-transform:uppercase;min-width:0;line-height:1.3}
.pane-h h2 svg{color:var(--accent);flex:none}
.sq{width:38px;height:34px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.sq svg{transition:transform .2s}
.collapsed .sq svg{transform:rotate(180deg)}
.collapsed .toc-body,.collapsed .pane-h h2 span{display:none}
.collapsed .pane-h{padding:12px 13px;justify-content:center;border-bottom:0}
.collapsed .pane-h h2{display:none}
.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.toc-body{display:flex;flex-direction:column;min-height:0;flex:1}
.selwrap{padding:12px 14px;border-bottom:1px solid var(--line)}
.select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:700;text-transform:uppercase;font-size:13.5px;color:var(--ink)}
.toc{padding:12px 14px 18px;display:flex;flex-direction:column;gap:8px}
.tdoc{margin:8px 4px 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tdoc:first-child{margin-top:0}
.tch{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--soft);border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px;text-transform:uppercase}
.tch svg{flex:none;color:var(--accent);transition:transform .15s}
.tch[aria-expanded="true"] svg{transform:rotate(90deg)}
.tarts{display:flex;flex-direction:column;gap:2px;padding:4px 0 8px}
.tart{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;border-radius:9px;padding:9px 12px;font-size:14px;color:var(--ink);line-height:1.4}
.tart:hover{background:var(--soft)}
.tart[aria-current="true"]{background:var(--sel);border-left-color:var(--accent);font-weight:600}
.rres{border:1px solid var(--line)}
.tart .rtag{display:block;margin-bottom:2px}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 16px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
.tgrp{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
.setwrap{position:relative;flex:none;margin-left:auto}
.setbtn{padding:8px 10px}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow),0 12px 40px rgba(0,0,0,.18);z-index:40;padding:8px}
.pop-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.pop-item:hover{background:var(--soft)}
.pop-item small{font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.4}
.pop-sec{margin:10px 12px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px}
.drow:hover{background:var(--soft)}
.dtx{min-width:0}.dtx b{display:block;font-size:13.5px}
.dtx small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dact{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:58%}
.tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px;white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;font-weight:700;font-size:14px}
.tbtn:hover{border-color:var(--accent)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}
.fsgrp{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:2px;gap:2px}
.fsgrp button{border:0;background:transparent;border-radius:7px;padding:4px 11px;font-weight:700;font-size:14px}
.fsgrp .a{color:var(--accent)}
.doc{padding:22px clamp(16px,4vw,44px) 40px;font-family:var(--font-doc);font-size:var(--fs);line-height:1.62}
.dochead{text-align:center;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:6px;font-family:var(--font-ui)}
.dochead h2{margin:0;color:var(--accent);font-size:clamp(16px,2vw,21px);font-weight:800;text-transform:uppercase;text-wrap:balance}
.dochead p{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.dochead .row{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mini.danger{color:var(--accent);border-color:var(--accent)}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-family:var(--font-ui);font-size:13.5px;text-align:left}
.banner button{border:0;background:transparent;color:var(--accent);font-weight:700;text-decoration:underline;padding:0}
.chap{margin:30px 0 0;padding:0 0 10px;color:var(--accent);font-family:var(--font-ui);font-size:1.05em;font-weight:800;line-height:1.4;text-transform:uppercase;text-align:center;border-bottom:2px solid var(--line);text-wrap:balance;overflow-wrap:anywhere;word-break:normal}
.copy{flex:none;text-align:center;font-size:11.5px;line-height:1.3;color:var(--muted);padding:6px 8px 0;opacity:.85}
.muc{margin:18px 0 0;padding-left:3.4em;font-family:var(--font-ui);font-weight:700;font-size:.95em;text-transform:uppercase}
.art{padding:16px 0 18px;border-bottom:1px solid var(--line);scroll-margin-top:8px}
.art:last-child{border-bottom:0}
.art.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.arth{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-left:3.4em}
.arth h3{margin:0 0 6px;font-family:var(--font-ui);font-size:1em;font-weight:800;line-height:1.4}
.cp{flex:none;border:0;background:transparent;color:var(--muted);padding:4px;border-radius:6px}
.cp:hover{color:var(--accent)}
.art p{margin:0 0 .35em;text-align:justify;text-indent:3.4em}
.art p.pt{padding-left:0}
.art p b{font-weight:700}
.nextprev{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;font-family:var(--font-ui)}
.nextprev.top{margin:0 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rpos{flex:1;text-align:center;font-weight:700;font-size:14px;min-width:0}
.rcount{padding:4px 4px 2px;color:var(--muted);font-size:13.5px}
.rnote{padding:9px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px;line-height:1.45}
.rtag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.more{width:100%;margin-top:4px}
.more small{font-weight:500;color:var(--muted)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:60;box-shadow:var(--shadow)}
.setbtn{position:relative}
.setbtn.dot::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 11px;font-family:var(--font-ui);font-size:12.5px;font-weight:700;border:1px solid currentColor;line-height:1.3}
.badge.ok{color:var(--ok);background:var(--ok-soft)}
.badge.warn{color:var(--warn);background:var(--warn-soft)}
.badge.bad{color:var(--bad);background:var(--bad-soft)}
.badge.unk{color:var(--muted);background:var(--soft)}
.vstat{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 12px;font-family:var(--font-ui);font-size:13px;color:var(--muted)}
.vrows{margin:12px auto 0;max-width:760px;display:grid;gap:4px;text-align:left;font-size:13.5px;color:var(--muted)}
.vrows b{color:var(--ink)}
.vrows a{color:var(--accent);word-break:break-all}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px;box-shadow:0 0 0 1.5px var(--card)}
.sd.ok{background:var(--ok)}.sd.warn{background:#e0a100}.sd.bad{background:var(--bad)}
.banner.issues{background:var(--warn-soft)}
.banner.issues summary{cursor:pointer;font-weight:700}
.banner.issues ul{margin:8px 0 0;padding-left:20px;max-height:220px;overflow:auto}
.warnbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:13px;max-height:190px;overflow:auto}
.warnbox ul{margin:6px 0 0;padding-left:20px}
.loadmore{text-align:center;padding:16px 0 28px;font-family:var(--font-ui)}
.art p.hit{background:var(--accent-soft);border-radius:6px;box-shadow:-6px 0 0 var(--accent-soft),6px 0 0 var(--accent-soft)}
.k-luat{--kc:var(--c-luat)}.k-nd{--kc:var(--c-nd)}.k-tt{--kc:var(--c-tt)}.k-ot{--kc:var(--c-ot)}
.rtag,.tdoc,.eyebrow.kcol{color:var(--kc,var(--accent))}
.tart.rres,.tart.rres[aria-current="true"]{border:1px solid var(--line);border-left:1px solid var(--line)}
.rres[aria-current="true"]{background:var(--sel)}
.chip.rord{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 8px;cursor:grab}
.chip.rord .lbl{padding:4px 6px}
.chip.rord button{border:0;background:var(--soft);color:var(--ink);border-radius:7px;min-width:30px;height:30px;font-size:14px;font-weight:700}
.chip.rord button:hover{background:var(--sel)}
.chip.rord.dragging{opacity:.4}
.chip.rord.dropt{outline:2px dashed var(--accent);outline-offset:2px}
.chip.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-style:solid}
/* Hộp thoại thêm văn bản */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.55);display:grid;place-items:center;padding:16px}
.sheet{width:min(720px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:18px;font-weight:800}
.sheet-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.drop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:14px;background:var(--soft);color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.lbl{font-weight:700;font-size:13px;margin-bottom:4px;display:block}
textarea,.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:14px}
textarea{min-height:170px;resize:vertical;font-family:var(--font-doc);font-size:15px;line-height:1.5}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2 .full{grid-column:1/-1}
.stat{font-size:13.5px;color:var(--muted);min-height:20px}
.stat b{color:var(--ink)}
.stat.warn{color:var(--accent)}
@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto}
  .main{min-height:auto}
  .cols,.cols.collapsed{display:flex;flex-direction:column}
  .pane{overflow:visible}
  .scroll{overflow:visible}
  .toc-body{max-height:56vh;overflow:auto}
  .collapsed .toc-body{display:none}
  .collapsed .pane-h h2{display:flex}
  .collapsed .pane-h h2 span{display:inline}
  .collapsed .pane-h{justify-content:space-between;border-bottom:0}
  .chips{justify-content:flex-start}
  .topbar{position:relative}
  .setwrap{position:static}
  .pop{left:8px;right:8px;width:auto}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.art.flash{animation:none}.sq svg,.tch svg{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <section class="card topbar" aria-label="Lọc văn bản và tìm kiếm">
      <div class="toprow">
      <div class="chips" id="chips"></div>
      <div class="setwrap">
        <button class="tbtn setbtn" id="setbtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="pop" aria-label="Cài đặt" title="Cài đặt"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h9M16 6h5M3 12h3M10 12h11M3 18h11M18 18h3"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg><span class="sr">Cài đặt</span></button>
        <div class="pop" id="pop" hidden>
          <button class="pop-item" type="button" data-act="add">Thêm văn bản luật<small>Từ file Word (.docx), PDF, .txt, hoặc dán nội dung</small></button>
          <button class="pop-item" type="button" data-act="reorder">Sắp xếp thứ tự văn bản<small>Đưa văn bản hay tra lên đầu danh sách</small></button>
          <div class="pop-sec">Quản lý văn bản</div>
          <div id="doclist"></div>
          <div class="pop-sec">Lưu cố định (khuyên dùng)</div>
          <button class="pop-item" type="button" id="emb">Tải file ứng dụng đã nhúng văn bản (.html)<small id="embnote"></small></button>
          <div class="pop-sec">Sao lưu</div>
          <button class="pop-item" type="button" id="exp">Sao chép dữ liệu đã thêm (JSON)<small>Dán vào Ghi chú để lưu. Dán lại vào “Thêm văn bản luật” để khôi phục.</small></button>
        </div>
      </div>
      </div>
      <div class="searchbox">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Tra cứu điều luật, nghị định, thông tư…" aria-label="Tra cứu">
        <button class="clr" id="qclr" type="button" aria-label="Xóa từ khóa" hidden>×</button>
      </div>
    </section>

    <div class="cols" id="cols">
      <section class="card pane" aria-label="Mục lục và kết quả tìm kiếm">

/* ===== Tiện ích ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nrm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase();
const slug = s => nrm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'vb';

/* ===== Chuẩn hóa cho tìm kiếm =====
   lcase: chữ thường, dạng NFC (giữ dấu). fold: bỏ dấu, GIỮ NGUYÊN độ dài chuỗi
   để vị trí khớp trên chuỗi bỏ dấu dùng được cho chuỗi gốc khi tô vàng. */
const FC=Object.create(null);
function foldCh(c){
  let r=FC[c];
  if(r===undefined){
    if(c==='đ'||c==='Đ') r='d';
    else { const x=c.normalize('NFD').replace(/[\u0300-\u036f]/g,''); r=x?x[0]:' '; }
    FC[c]=r;
  }
  return r;
}
function fold(s){ let o=''; for(let i=0;i<s.length;i++) o+=foldCh(s[i]); return o; }
/* Hai c\u00e1ch \u0111\u1eb7t d\u1ea5u thanh \u0111\u1ec1u \u0111\u00fang: "\u1ee7y/u\u1ef7", "h\u00f2a/ho\u00e0", "th\u00fay/thu\u00fd"... Ch\u1ec9 d\u00f9ng \u0111\u1ec3 \u0111\u1ed1i chi\u1ebfu t\u00ecm ki\u1ebfm
   (thay 2 k\u00fd t\u1ef1 b\u1eb1ng \u0111\u00fang 2 k\u00fd t\u1ef1 n\u00ean \u0111\u1ed9 d\u00e0i gi\u1eef nguy\u00ean, n\u1ed9i dung hi\u1ec3n th\u1ecb kh\u00f4ng \u0111\u1ed5i). */
const TONE={'\u00f2a':'o\u00e0','\u00f3a':'o\u00e1','\u1ecfa':'o\u1ea3','\u00f5a':'o\u00e3','\u1ecda':'o\u1ea1','\u00f2e':'o\u00e8','\u00f3e':'o\u00e9','\u1ecfe':'o\u1ebb','\u00f5e':'o\u1ebd','\u1ecde':'o\u1eb9','\u00f9y':'u\u1ef3','\u00fay':'u\u00fd','\u1ee7y':'u\u1ef7','\u0169y':'u\u1ef9','\u1ee5y':'u\u1ef5'};
const lcase = s => String(s==null?'':s).normalize('NFC').replace(/[\u00a0\u2000-\u200b\u202f\u3000]/g,' ').toLowerCase().replace(/[\u00f2\u00f3\u1ecf\u00f5\u1ecd][ae]|[\u00f9\u00fa\u1ee7\u0169\u1ee5]y/g,m=>TONE[m]);
const isW = c => c!==undefined && /[\p{L}\p{N}]/u.test(c);
/* Tìm mọi vị trí khớp theo ranh giới từ (không khớp khi nằm giữa từ khác) */
function findAll(hay,t,open){
  const r=[]; if(!t) return r;
  const a=isW(t[0]), b=open?false:isW(t[t.length-1]); let p=0;
  while((p=hay.indexOf(t,p))>-1){
    const e=p+t.length;
    if((!a||!isW(hay[p-1]))&&(!b||!isW(hay[e]))){ r.push(p); p=e; } else p++;
  }
  return r;
}
/* Chỉ mục tìm kiếm tính sẵn cho từng điều (không ghi vào dữ liệu lưu trong localStorage) */
const IDX=new WeakMap();
function idx(a){
  let x=IDX.get(a);
  if(!x){
    const tl=lcase(a.title), bl=lcase((a.body||[]).join('\n'));
    x={tl,tn:fold(tl),bl,bn:fold(bl),nn:fold(lcase(a.n))};
    IDX.set(a,x);
  }
  return x;
}

/* ===== Lưu trữ cục bộ (chỉ trong trình duyệt này) ===== */
const ORDER_KEY='thads.order.v1';
const EMB_ORDER=/*ORDER_START*/[]/*ORDER_END*/;

/* ===== Đồng bộ với index.html (Firebase) qua postMessage ===== */
let syncMute=false;
function pushSync(){
  if(syncMute||window.parent===window) return;
  try{ window.parent.postMessage({type:'DATA_RETURN',app:'app4',data:{'thads.docs.v1':localStorage.getItem('thads.docs.v1')||'[]','thads.order.v1':localStorage.getItem('thads.order.v1')||'[]'}},'*'); }catch(e){}
}
const KEY='thads.docs.v1';
let userDocs=[];
try{ userDocs = JSON.parse(localStorage.getItem(KEY)||'[]') || []; }catch(e){ userDocs=[]; }
/* Bỏ các trường tính toán (key, _xxx) khi lưu/sao lưu để dữ liệu gọn */
const REP=(k,v)=> (k==='key'||(k&&k[0]==='_')) ? undefined : v;
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(userDocs,REP)); pushSync(); return true; }catch(e){ return false; } }
/* Bản lưu trong trình duyệt trùng hệt bản đã nhúng trong file thì bỏ đi, để file luôn là nguồn chính */
(function(){ const n0=userDocs.length;

  if(userDocs.length!==n0) persist(); })();

const KIND_RANK={'Luật':0,'Nghị quyết':1,'Nghị định':2,'Quyết định':3,'Thông tư liên tịch':4,'Thông tư':5};
let docs=[], DV=0, PEND=false; const ISS=new Map();
function buildDocs(){
  const uids=new Set(userDocs.map(d=>d.id)); const real = BUILTIN.filter(d=>!d.sample&&!uids.has(d.id)).concat(userDocs);
  let list = real.length ? real : BUILTIN.filter(d=>d.sample);
  list = list.slice().sort((a,b)=>{
    const ra=KIND_RANK[a.kind]??9, rb=KIND_RANK[b.kind]??9; if(ra!==rb) return ra-rb;
    const pa=(a.number||'').split('/'), pb=(b.number||'').split('/');
    return ((+pa[1]||0)-(+pb[1]||0)) || ((+pa[0]||0)-(+pb[0]||0));
  });
  list.forEach(d=>{
    const seen={};
    d.chapters.forEach(ch=>{ (ch.articles||[]).forEach(a=>{
      const base=String(a.n).replace(/[^A-Za-z0-9]/g,'')||'x'; seen[base]=(seen[base]||0)+1;
      a.key = seen[base]>1 ? base+'x'+seen[base] : base;
    }); });
  });
  const ord=userOrder.length?userOrder:EMB_ORDER;
  if(ord.length){ const pos=new Map(ord.map((id,i)=>[id,i])); list=list.map((d,i)=>[d,i]).sort((a,b)=>((pos.has(a[0].id)?pos.get(a[0].id):1e6)-(pos.has(b[0].id)?pos.get(b[0].id):1e6))||(a[1]-b[1])).map(x=>x[0]); }
  docs=list; DV++; ISS.clear();
  PEND=(userOrder.length>0&&JSON.stringify(userOrder.filter(id=>list.some(d=>d.id===id)))!==JSON.stringify(EMB_ORDER))||userDocs.some(u=>{ const b=BUILTIN.find(x=>x.id===u.id&&!x.sample); return !b||JSON.stringify(b,REP)!==JSON.stringify(u,REP); });
}

const dtag=d=>(d.chip||d.title);

function validateDoc(chs){
  const out=[], arts=[]; chs.forEach(c=>(c.articles||[]).forEach(a=>arts.push(a)));
  const seen=new Set(); let prev=null;
  arts.forEach(a=>{
    const label='Điều '+a.n, m=String(a.n).match(/^(\d+)([a-zđ]*)$/), num=m?+m[1]:NaN, suf=m?m[2]:'';
    if(seen.has(String(a.n))) out.push(label+' bị trùng số (xuất hiện nhiều lần)'); seen.add(String(a.n));
    if(!(a.body&&a.body.length)) out.push(label+' không có nội dung');
    if(!String(a.title||'').trim()) out.push(label+' chưa có tên điều');
    if(!isNaN(num)){
      if(prev===null){ if(num!==1||suf) out.push('Điều đầu tiên là '+label+', không phải Điều 1 (có thể thiếu phần đầu)'); }
      else if(num>prev+1) out.push('Thiếu '+(num-prev===2?'Điều '+(prev+1):'Điều '+(prev+1)+' đến Điều '+(num-1))+' (giữa Điều '+prev+' và '+label+')');
      else if(num<prev) out.push(label+' nằm sau Điều '+prev+' (sai thứ tự)');
      if(prev===null||num>prev) prev=num;
    }
    let kp=0;
    (a.body||[]).forEach(l=>{ const k=l.match(/^(\d{1,2})\.\s/); if(k){ const n=+k[1];
      if(n!==kp+1) out.push(label+': khoản '+n+(kp?' đứng sau khoản '+kp:' xuất hiện đầu tiên')+' (kiểm tra có thiếu khoản không)'); kp=n; } });
  });
  return out;
}

/* ===== Tìm kiếm =====
   a) "điều 80", "dieu 80", "đ80", "d80" hoặc chỉ "80"/"80a": đúng Điều có số đó.
   b) Cụm từ nguyên văn, khớp ranh giới từ. Gõ có dấu thì khớp có dấu; gõ không dấu thì khớp bỏ dấu. Hỗ trợ "..." .
   c) Không có kết quả mới dùng dự phòng: các từ cùng xuất hiện trong một điều.
   d) Xếp hạng: cụm trong tiêu đề, rồi số lần trong nội dung, rồi thứ tự điều. */
function rankSort(arr){ return arr.sort((p,q)=>(q.tin-p.tin)||(q.bc-p.bc)||(p.i-q.i)).map(r=>r.x); }
function runSearch(raw){
  raw=raw.replace(/\s+/g,' ').trim();
  const scope=searchScope();
  const R={q:raw,mode:'phrase',hits:[],terms:[],fallback:false,pre:false,num:'',sub:null};
  const nq=nrm(raw);
  /* a) "điều 80", "d80", "80", "khoản 2 điều 80", "điều 80 khoản 2", "điểm a khoản 2 điều 80" */
  let m=nq.match(/^(?:diem\s+([a-z])\s+)?khoan\s+(\d+)\s+(?:dieu|d)\s*(\d+[a-z]?)$/), num=null, sub=null;
  if(m){ num=m[3]; sub={k:m[2],p:m[1]||''}; }
  else if((m=nq.match(/^(?:dieu|d)\s*(\d+[a-z]?)\s+khoan\s+(\d+)(?:\s+diem\s+([a-z]))?$/))){ num=m[1]; sub={k:m[2],p:m[3]||''}; }
  else if((m=nq.match(/^(?:dieu|d)\s*(\d+[a-z]?)$/))){ num=m[1]; }
  else if((m=nq.match(/^(\d+[a-z]?)$/))){ num=m[1]; R.bare=true; }
  if(num){
    const hits=scope.filter(x=>idx(x.a).nn===num);
    /* chỉ gõ số (vd "2020", "106") mà không có Điều đó thì tìm như từ khóa trong nội dung */
    if(hits.length||!R.bare){ R.mode='num'; R.num=num; R.sub=sub; R.hits=hits; return R; }
  }
  const strict=raw.length>=2&&/^["“”].*["“”]$/.test(raw);
  const ph=raw.replace(/["“”]/g,' ').replace(/\s+/g,' ').trim();
  if(!ph) return R;
  const p=lcase(ph), diac=fold(p)!==p;
  const run=terms=>{ const out=[]; scope.forEach((x,i)=>{
    const ix=idx(x.a); let all=true, allT=true, bsum=0;
    for(const t of terms){
      const tc=findAll(t.d?ix.tl:ix.tn,t.t,t.p).length, bc=findAll(t.d?ix.bl:ix.bn,t.t,t.p).length;
      if(!(tc+bc)){ all=false; break; }
      if(!tc) allT=false; bsum+=bc;
    }
    if(all) out.push({x,i,tin:allT?1:0,bc:bsum}); }); return out; };
  /* b) nguyên cụm, khớp ranh giới từ */
  let T=[{t:p,d:diac}], res=run(T); R.terms=T;
  if(res.length){ R.hits=rankSort(res); return R; }
  if(strict) return R;
  /* c) nguyên cụm, từ cuối đang gõ dở (vd "kê biên tài s") */
  T=[{t:p,d:diac,p:true}]; res=run(T);
  if(res.length){ R.pre=true; R.terms=T; R.hits=rankSort(res); return R; }
  const words=Array.from(new Set(p.split(' ').filter(Boolean)));
  const mk=pre=>words.map((w,i)=>({t:w,d:fold(w)!==w,p:pre&&i===words.length-1}));
  /* d) đủ các từ trong cùng một điều */
  if(words.length>=2){ T=mk(false); res=run(T); if(res.length){ R.fallback=true; R.terms=T; R.hits=rankSort(res); return R; } }
  /* e) như d) nhưng từ cuối đang gõ dở */
  T=mk(true); res=run(T); if(res.length){ R.pre=true; R.terms=T; R.hits=rankSort(res); }
  return R;
}

/* Tô vàng các cụm từ khóa (terms = [{t,d}]); vị trí tính trên chuỗi chữ thường hoặc bỏ dấu cùng độ dài */
function hl(text,terms){
  text=String(text).normalize('NFC');
  if(!terms||!terms.length) return esc(text);
  const lc=lcase(text); if(lc.length!==text.length) return esc(text);
  const nd=fold(lc), rs=[];
  terms.forEach(({t,d,p})=>{ findAll(d?lc:nd,t,p).forEach(o=>rs.push([o,o+t.length])); });
  if(!rs.length) return esc(text);
  rs.sort((a,b)=>a[0]-b[0]); const m=[];
  rs.forEach(r=>{ const l=m[m.length-1]; if(l&&r[0]<=l[1]) l[1]=Math.max(l[1],r[1]); else m.push(r.slice()); });
  let o='',i=0; m.forEach(r=>{ o+=esc(text.slice(i,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'</mark>'; i=r[1]; });
  return o+esc(text.slice(i));
}
function paraHtml(line,terms,hit){

  const isPt=/^[a-zđ]\)/.test(line);
  const cls=((isPt?'pt':'')+(hit?' hit':'')).trim(), at=cls?' class="'+cls+'"':'';
  if(m) return '<p'+at+'><b>'+esc(m[1])+'</b> '+hl(m[2],terms)+'</p>';
  return '<p'+at+'>'+hl(line,terms)+'</p>';
}
/* Tìm đoạn [từ,đến) của khoản (và điểm) cần tra trong nội dung điều */
function subRange(body,sub){
  if(!sub) return null; let s=-1,e=body.length;
  for(let i=0;i<body.length;i++){ const m=body[i].match(/^(\d+)[.)]\s/); if(m){ if(s<0){ if(m[1]===sub.k) s=i; } else { e=i; break; } } }
  if(s<0) return null;
  if(sub.p){ let ps=-1,pe=e;
    for(let i=s+1;i<e;i++){ const m=body[i].match(/^([a-zđ])\)\s/); if(m){ if(ps<0){ if(nrm(m[1])===sub.p) ps=i; } else { pe=i; break; } } }
    return ps<0?null:[ps,pe]; }

function ensureVisible(sel){

  let p=el.parentElement;
  while(p&&p!==document.body){
    const cs=getComputedStyle(p);
    if(/(auto|scroll)/.test(cs.overflowY)&&p.scrollHeight>p.clientHeight){
      const er=el.getBoundingClientRect(), pr=p.getBoundingClientRect();
      if(er.top<pr.top) p.scrollTop-=pr.top-er.top+8; else if(er.bottom>pr.bottom) p.scrollTop+=er.bottom-pr.bottom+8;

    p=p.parentElement;

}

/* ===== Phân tích văn bản thô thành Chương / Điều ===== */
function parseLaw(text){
  const lines=text.replace(/\r/g,'').split('\n').map(s=>s.replace(/\u00a0/g,' ').trim()).filter(Boolean);
  const reCh=/^(?:CHƯƠNG|Chương)\s+([IVXLCDM]+|\d+)(?=\s|[.:\-–—]|$)\s*[.:\-–—]?\s*(.*)$/;
  const reMuc=/^(?:MỤC|Mục)\s+(\d+|[IVXLCDM]+)(?=\s|[.:\-–—]|$)\s*[.:\-–—]?\s*(.*)$/;
  const reDieu=/^Điều\s+(\d+[a-zđ]?)(?:\s*[.:]\s*(.*))?$/;
  const isStruct=l=>reCh.test(l)||reMuc.test(l)||reDieu.test(l);
  const chapters=[]; let ch=null, art=null, muc=null, skipped=0, artCount=0, ended=false;
  for(let i=0;i<lines.length;i++){
    const l=lines[i]; let m;
    /* "Nơi nhận:" là phần cuối văn bản (nơi nhận, chữ ký) — không đưa vào nội dung điều cuối */
    if(art && /^Nơi nhận\s*:?\s*$/i.test(l)) ended=true;
    if(ended) continue;
    if((m=l.match(reCh))){
      let t=m[2]; if(!t && i+1<lines.length && !isStruct(lines[i+1]) && lines[i+1].length<220) t=lines[++i];
      ch={title:'CHƯƠNG '+m[1]+(t?': '+t.toUpperCase():''),articles:[]}; chapters.push(ch); art=null; muc=null; continue;
    }
    if((m=l.match(reMuc))){
      let t=m[2]; if(!t && i+1<lines.length && !isStruct(lines[i+1]) && lines[i+1].length<220) t=lines[++i];
      muc='MỤC '+m[1]+(t?': '+t.toUpperCase():''); continue;
    }
    if((m=l.match(reDieu))){
      /* Văn bản không chia Chương (chỉ có Điều, khoản, điểm): gom vào một nhóm không tên */
      if(!ch){ ch={title:'',articles:[]}; chapters.push(ch); }
      let at=(m[2]||'').trim();
      if(!at && i+1<lines.length && !isStruct(lines[i+1]) && lines[i+1].length<200 && !/^(\d+[.)]|[a-zđ]\))\s/.test(lines[i+1])) at=lines[++i];
      art={n:m[1],title:at,body:[]}; if(muc){ art.muc=muc; muc=null; }
      ch.articles.push(art); artCount++; continue;
    }
    if(art) art.body.push(l); else skipped++;
  }
  const head=lines.slice(0,40);
  let kind='', number='', date='', title='';
  for(let i=0;i<head.length;i++){
    const k=head[i].match(/^(BỘ LUẬT|LUẬT|NGHỊ ĐỊNH|THÔNG TƯ LIÊN TỊCH|THÔNG TƯ|QUYẾT ĐỊNH|NGHỊ QUYẾT)(?=\s|$)\s*(.*)$/i);
    if(k && !title){
      const word=k[1].toLowerCase(); kind = word.includes('liên tịch')?'Thông tư liên tịch':word.includes('nghị định')?'Nghị định':word.includes('thông tư')?'Thông tư':word.includes('quyết định')?'Quyết định':word.includes('nghị quyết')?'Nghị quyết':'Luật';
      let rest=k[2]; if(!rest && head[i+1] && !/^(Số|Luật số)/i.test(head[i+1])) rest=head[i+1];
      const cap=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
      if(rest && kind!=='Luật') rest = rest.charAt(0).toLowerCase()+rest.slice(1);
      title = rest ? (kind==='Luật'?'Luật ':kind+' ')+(rest===rest.toUpperCase()?rest.toLowerCase():rest) : '';
      if(kind==='Luật' && /bộ luật/i.test(k[1])) title = 'Bộ luật '+(rest||'').toLowerCase();
      title = title.charAt(0).toUpperCase()+title.slice(1);
    }
    if(!number){ const nm=head[i].match(/(\d{1,4}\/\d{4}\/[A-ZĐ0-9]+(?:-[A-ZĐ0-9]+)*)/); if(nm) number=nm[1]; }
    if(!date){ const dm=head[i].match(/(\d{1,2})\s+tháng\s+(\d{1,2})\s+năm\s+(\d{4})/i)||head[i].match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(dm) date=dm[1].padStart(2,'0')+'/'+dm[2].padStart(2,'0')+'/'+dm[3]; }
  }
  if(!kind && number){ kind = /NĐ/.test(number)?'Nghị định':/TTLT/.test(number)?'Thông tư liên tịch':/TT/.test(number)?'Thông tư':/NQ/.test(number)?'Nghị quyết':/QĐ/.test(number)?'Quyết định':/QH/.test(number)?'Luật':''; }
  return {chapters,artCount,skipped,kind,number,date,title};
}

}
/* Đọc .docx và GIỮ số tự động của Word ("Điều 1.", "1.", "a)", "I."...).
   mammoth.extractRawText bỏ mất các số này nên Điều 1–7 trong nhiều văn bản bị mất tiêu đề. */
async function docxToText(buf){
  const zip=await JSZip.loadAsync(buf);
  const rd=async p=>{ const f=zip.file(p); return f?await f.async('string'):null; };
  const px=s=>new DOMParser().parseFromString(s,'application/xml');
  const docXml=await rd('word/document.xml'); if(!docXml) throw new Error('no document.xml');
  const D=px(docXml), numXml=await rd('word/numbering.xml'), styXml=await rd('word/styles.xml');
  const val=(el,tag)=>{ const c=el&&el.getElementsByTagName(tag)[0]; return c?c.getAttribute('w:val'):null; };
  /* định nghĩa danh sách */
  const abs={}, nums={};
  if(numXml){ const N=px(numXml);
    Array.from(N.getElementsByTagName('w:abstractNum')).forEach(a=>{ const lv={};
      Array.from(a.getElementsByTagName('w:lvl')).forEach(l=>{ lv[l.getAttribute('w:ilvl')]={fmt:val(l,'w:numFmt')||'decimal',text:val(l,'w:lvlText')||'',start:+(val(l,'w:start')||1)}; });
      abs[a.getAttribute('w:abstractNumId')]=lv; });
    Array.from(N.getElementsByTagName('w:num')).forEach(n=>{ const ov={}; let has=false;
      Array.from(n.getElementsByTagName('w:lvlOverride')).forEach(o=>{ const s=val(o,'w:startOverride'); if(s!==null){ ov[o.getAttribute('w:ilvl')]=+s; has=true; } });
      nums[n.getAttribute('w:numId')]={abs:val(n,'w:abstractNumId'),ov,has}; }); }
  /* số gắn theo kiểu đoạn (style) */
  const sty={};
  if(styXml){ Array.from(px(styXml).getElementsByTagName('w:style')).forEach(s=>{ const np=s.getElementsByTagName('w:numPr')[0];
    sty[s.getAttribute('w:styleId')]={based:val(s,'w:basedOn'),numId:np?val(np,'w:numId'):null,ilvl:np?val(np,'w:ilvl'):null}; }); }
  const styNum=id=>{ for(let g=0;id&&sty[id]&&g<10;g++){ if(sty[id].numId!==null) return sty[id]; id=sty[id].based; } return null; };
  const letters=(v,up)=>{ let s=''; while(v>0){ v--; s=String.fromCharCode(97+v%26)+s; v=Math.floor(v/26); } return up?s.toUpperCase():s; };
  const roman=(v,up)=>{ const r=[[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],[50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']]; let s=''; r.forEach(([n,c])=>{ while(v>=n){ s+=c; v-=n; } }); return up?s.toUpperCase():s; };
  const fmt=(v,f)=>f==='lowerLetter'?letters(v):f==='upperLetter'?letters(v,1):f==='lowerRoman'?roman(v):f==='upperRoman'?roman(v,1):f==='decimalZero'?(v<10?'0':'')+v:String(v);
  /* lấy chữ của đoạn (bỏ phần bị xóa khi theo dõi chỉnh sửa) */
  const txt=el=>{ let s=''; for(const c of Array.from(el.childNodes)){ if(c.nodeType!==1) continue; const t=c.nodeName;
    if(t==='w:t') s+=c.textContent; else if(t==='w:tab'||t==='w:br') s+=' '; else if(t==='w:noBreakHyphen') s+='-'; else if(t==='w:del'||t==='w:delText'||t==='w:pPr') continue; else s+=txt(c); } return s; };
  const counters={}, out=[];
  Array.from(D.getElementsByTagName('w:p')).forEach(p=>{
    let pre='', text=txt(p).replace(/\u00a0/g,' ').trim();
    const ppr=Array.from(p.childNodes).find(c=>c.nodeName==='w:pPr'); const np=ppr&&Array.from(ppr.childNodes).find(c=>c.nodeName==='w:numPr');
    let numId=np?val(np,'w:numId'):null, lvl=np?val(np,'w:ilvl'):null;
    if(numId===null){ const sn=styNum(ppr?val(ppr,'w:pStyle'):null); if(sn){ numId=sn.numId; lvl=sn.ilvl; } }
    if(numId&&numId!=='0'&&nums[numId]&&abs[nums[numId].abs]){
      const def=abs[nums[numId].abs]; lvl=String(lvl||0); const L=def[lvl];
      if(L){ const key=nums[numId].has?'n'+numId:'a'+nums[numId].abs; const c=counters[key]||(counters[key]={});
        const li=+lvl, ovS=nums[numId].ov[lvl];
        c[li]=(c[li]===undefined)?(ovS!==undefined?ovS:L.start):c[li]+1;
        Object.keys(c).forEach(k=>{ if(+k>li) delete c[k]; });
        if(L.fmt==='bullet') pre='- ';
        else { pre=L.text.replace(/%(\d)/g,(m0,d)=>{ const k=+d-1, Lk=def[String(k)]; const v=c[k]!==undefined?c[k]:(Lk?Lk.start:1); return fmt(v,Lk?Lk.fmt:'decimal'); });
          if(L.fmt==='lowerLetter') pre=pre.replace(/\.$/,')'); /* điểm a), b) */ }
      } }
    if(text) out.push(pre?pre+(/\s$/.test(pre)?'':' ')+text:text);
  });
  return out.join('\n');
}
/* Đọc PDF (có lớp chữ) bằng pdf.js, ghép các dòng bị ngắt thành đoạn để tách đúng Điều/khoản/điểm */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/';
let pdfLib=null;
async function loadPdfJs(){
  if(pdfLib) return pdfLib;
  const lib=await import(PDFJS+'pdf.min.mjs');
  try{ const r=await fetch(PDFJS+'pdf.worker.min.mjs'); const b=await r.blob();
    lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([b],{type:'text/javascript'})); }
  catch(e){ lib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.mjs'; }
  return pdfLib=lib;
}
async function pdfToText(buf){
  const lib=await loadPdfJs();
  const pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise;
  const lines=[];
  for(let n=1;n<=pdf.numPages;n++){
    const items=(await (await pdf.getPage(n)).getTextContent()).items.filter(i=>i.str!==undefined);
    let cur='', y=null, endX=null;
    const flush=()=>{ if(cur.trim()) lines.push(cur.replace(/\s+/g,' ').trim()); cur=''; };
    items.forEach(it=>{
      const ty=it.transform[5], tx=it.transform[4], h=Math.abs(it.transform[3])||10;
      if(y!==null && Math.abs(ty-y)>h*0.5) flush();
      else if(cur && endX!==null && tx-endX>h*0.15 && !/\s$/.test(cur) && !/^\s/.test(it.str)) cur+=' ';
      cur+=it.str; y=ty; endX=tx+(it.width||0);
      if(it.hasEOL) flush();
    });
    flush();
  }
  if(lines.join('').length<30) throw new Error('scan');
  /* ghép dòng: chỉ bắt đầu đoạn mới khi gặp Chương/Mục/Điều, khoản "1.", điểm "a)", hoặc câu trước đã kết thúc và câu sau viết hoa */
  const mark=/^(Chương|CHƯƠNG|Mục|MỤC)\s+[\dIVXLCDM]+\s*([.:\-–—]|$)|^Điều\s+\d+[a-zđ]?\s*([.:]|$)|^\d{1,2}[.)]\s|^[a-zđ]\)\s|^(Nơi nhận|-\s)/;
  const out=[]; let started=false;
  lines.forEach(l=>{
    if(!started && /^(Chương|CHƯƠNG|Điều)\s+[\dIVXLCDM]+\s*([.:\-–—]|$)/.test(l)) started=true;
    if(!started){ out.push(l); return; } /* phần đầu (quốc hiệu, tên văn bản, căn cứ): giữ nguyên từng dòng */
    const prev=out[out.length-1];
    const prevStruct=prev&&/^(Chương|CHƯƠNG|Mục|MỤC|Điều)\s+[\dIVXLCDM]+/.test(prev);
    const upper=/^[A-ZÀ-Ỹ]/.test(l), prevEnd=prev&&/[.;:]$/.test(prev);
    if(!prev||mark.test(l)||prevStruct&&!/^(Chương|CHƯƠNG|Mục|MỤC)\s+[\dIVXLCDM]+\s*[.:\-–—]?\s*$/.test(prev)||(prevEnd&&upper)) out.push(l);
    else out[out.length-1]=prev+' '+l;
  });
  return out.join('\n');
}
async function readFile(f){
  if(!f) return; const name=f.name.toLowerCase();
  try{
    if(name.endsWith('.docx')){
      const buf=await f.arrayBuffer(); let done=false;
      if(typeof JSZip!=='undefined'){ try{ $('#txt').value=await docxToText(buf); done=true; }catch(e){ console.warn('docxToText',e); } }
      if(!done){
        if(typeof mammoth==='undefined'){ toast('Không nạp được bộ đọc Word. Hãy dán nội dung vào ô.'); return; }
        const r=await mammoth.extractRawText({arrayBuffer:buf}); $('#txt').value=r.value;
        toast('Đọc ở chế độ cơ bản: số “Điều” tự động của Word có thể bị mất');
      }
    } else if(name.endsWith('.pdf')){
      try{ $('#txt').value=await pdfToText(await f.arrayBuffer()); }
      catch(e){ toast(e.message==='scan'?'PDF này là ảnh quét, không có lớp chữ nên không đọc được. Hãy dùng bản Word hoặc PDF có thể bôi đen chữ.':'Không đọc được file PDF này'); return; }
    } else if(name.endsWith('.json')){
      const j=JSON.parse(await f.text()); const arr=Array.isArray(j)?j:(j.docs||[j]); let n=0;
      arr.forEach(d=>{ if(d&&d.chapters){ d.id=d.id||slug(d.chip||d.title||'vb'); userDocs.push(d); n++; } });
      if(n){ persist(); buildDocs(); setSel([]); closeModal(); render(); toast('Đã nạp '+n+' văn bản'); } else toast('File JSON không đúng định dạng'); return;
    } else { $('#txt').value=await f.text(); }
    touched={}; analyse();
  }catch(e){ toast('Không đọc được file này'); }
}

function buildEmbedded(){
  const ids=new Set(userDocs.map(d=>d.id));
  const all=BUILTIN.filter(d=>!d.sample&&!ids.has(d.id)).concat(userDocs);
  if(!all.length) return null;
  const json=JSON.stringify(all,REP).replace(/</g,'\\u003c');
  const re=/\/\*DATA_START\*\/[\s\S]*?\/\*DATA_END\*\//;
  if(!re.test(HTML0)) return null;
  const ro=/\/\*ORDER_START\*\/[\s\S]*?\/\*ORDER_END\*\//;
  const ordJson=JSON.stringify(docs.filter(d=>!d.sample).map(d=>d.id));
  let out=HTML0.replace(re,()=>'/*DATA_START*/'+json+'/*DATA_END*/');
  if(ro.test(out)) out=out.replace(ro,()=>'/*ORDER_START*/'+ordJson+'/*ORDER_END*/');
  return out;
}
function downloadEmbedded(){
  const h=buildEmbedded(); if(!h){ toast('Chưa có văn bản thật để nhúng. Hãy thêm văn bản trước.'); return; }
  try{
    const u=URL.createObjectURL(new Blob([h],{type:'text/html;charset=utf-8'}));
    const a=document.createElement('a'); a.href=u; a.download='tra-cuu-van-ban-luat-'+new Date().toISOString().slice(0,10)+'.html';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('Đã tạo file. Dùng file này thay cho file cũ và gửi cho đồng nghiệp.');
  }catch(e){ toast('Trình duyệt không cho tải file này'); }
}

   Chỉ cập nhật khi dữ liệu khác bản đang có (tránh vòng lặp), không reload trang, không gửi ngược lại. */
window.addEventListener('message',function(e){
  const m=e.data; if(!m||m.type!=='RESTORE_DATA'||!m.payload) return;
  const d=m.payload; let changed=false;
  try{
    const curD=localStorage.getItem(KEY)||'[]', curO=localStorage.getItem(ORDER_KEY)||'[]';
    if(typeof d['thads.docs.v1']==='string' && d['thads.docs.v1']!==curD){ localStorage.setItem(KEY,d['thads.docs.v1']); changed=true; }
    if(typeof d['thads.order.v1']==='string' && d['thads.order.v1']!==curO){ localStorage.setItem(ORDER_KEY,d['thads.order.v1']); changed=true; }
  }catch(err){ return; }
  if(!changed) return;
  syncMute=true;
  try{
    try{ userDocs=JSON.parse(localStorage.getItem(KEY)||'[]')||[]; if(!Array.isArray(userDocs)) userDocs=[]; }catch(x){ userDocs=[]; }
    try{ userOrder=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]')||[]; if(!Array.isArray(userOrder)) userOrder=[]; }catch(x){ userOrder=[]; }
    buildDocs();
    setSel(Array.from(S.sel).filter(id=>getDoc(id)));
    if(S.act&&!findArt(S.act.d,S.act.k)) S.act=null;
    S.chap='all'; S._rk=''; S._fk='';
    render(); renderSettings();
  } finally { syncMute=false; }
});

/* ===== Khởi động ===== */
buildDocs();
(function init(){
  const h=decodeURIComponent((location.hash||'').slice(1));
  let did=null,k=null;
  if(h){ const p=h.lastIndexOf('_d'); if(p>0){ did=h.slice(0,p); k=h.slice(p+2); } else if(getDoc(h)) did=h; }
  if(did&&getDoc(did)){ setSel([did]); const d=getDoc(did); if(k&&findArt(did,k)){ S.act={d:did,k}; S.open.add(did+'|'+findArt(did,k).ci); S.mode='single'; } else if(d.chapters[0]) S.open.add(did+'|0'); }
  else { const d=docs[0]; if(d&&d.chapters[0]) S.open.add(d.id+'|0'); }
  render();
})();
})();
</script>
